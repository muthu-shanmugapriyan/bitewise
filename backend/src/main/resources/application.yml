spring:
  application:
    name: bitewise-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bitewise}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Email configuration
  #
  # Gmail:
  #   Port 465 = implicit SSL
  #   STARTTLS = disabled
  #
  # MAIL_HOST=smtp.gmail.com
  # MAIL_PORT=465
  # MAIL_STARTTLS=false
  # MAIL_SSL=true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true

          # Port 465 uses implicit SSL.
          # Do NOT use STARTTLS on 465.
          starttls:
            enable: false

          ssl:
            enable: true

            # Trust Gmail's SMTP certificate.
            trust: smtp.gmail.com

        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

server:
  port: ${PORT:8080}

bitewise:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  frontend:
    base-url: ${FRONTEND_BASE_URL}
  mail:
    from: ${MAIL_FROM}

logging:
  level:
    com.bitewise: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
