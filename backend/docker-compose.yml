services:
  postgres:
    image: postgres:16
    container_name: bitewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitewise
      POSTGRES_USER: bitewise
      POSTGRES_PASSWORD: bitewise
    ports:
      - "5432:5432"
    volumes:
      - bitewise_pgdata:/var/lib/postgresql/data

volumes:
  bitewise_pgdata:
